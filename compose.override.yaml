---
# Development environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      - /app/vendor
      # Persist encryption key across container rebuilds (VOLUME /app/var/ in Dockerfile
      # creates an anonymous volume that is lost on rebuild)
      - encryption-key:/app/var/encryption
    environment:
      SERVER_NAME: "localhost, 192.168.137.1, php:80"
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Flutter mobile APK — download page at http://localhost:3000 or http://192.168.137.1:3000
  mobile:
    build:
      context: ../greffe_renale_mobile
      args:
        API_BASE_URL: https://192.168.137.1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - php
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

volumes:
  encryption-key:

