---
# Production environment override
services:
  php:
    build:
      context: .
      target: frankenphp_prod
    environment:
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      APP_SECRET: ${APP_SECRET}
      ENCRYPTION_KEY_PATH: /app/var/encryption/encryption.key
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        tls /etc/caddy/certs/tls.pem /etc/caddy/certs/tls.key
        redir /mobile /mobile/ 308
        handle_path /mobile/* {
          reverse_proxy mobile:80
        }
    volumes:
      - ./frankenphp/certs:/etc/caddy/certs:ro
      - encryption-key:/app/var/encryption

  mobile:
    build:
      context: ../greffe_renale_mobile
      # Use the lightweight Dockerfile that ships a prebuilt APK.
      # Build the APK on a developer machine first (see Dockerfile.prebuilt header).
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - php

volumes:
  encryption-key:
